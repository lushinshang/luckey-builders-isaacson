<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>上手快與上限高：兩種介面的概念示意</title>
<desc>依講者說法整理的示意，曲線形狀不是量測資料，縱軸不標數值。橫軸是練習時間，標出 1 分鐘、10 分鐘、1,000 小時、5 萬小時。iPhone 模式的曲線一開始很快爬升，到 10 分鐘附近就碰到天花板，之後一路持平；Luckey 嚮往的介面一開始爬得慢，要練數月到數年，到右端仍在上升，上限比 iPhone 模式高。</desc>
<rect width="960" height="540" fill="#fbfaf7"/>
<style>
.draw{animation:draw 4.2s cubic-bezier(.45,.05,.35,1) 0.6s both}
@keyframes draw{from{stroke-dashoffset:1.05}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.draw,.breathe{animation:none}}
</style>
