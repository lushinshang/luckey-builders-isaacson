<line x1="96" y1="446" x2="243.2" y2="318.1" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<line x1="96" y1="446" x2="188.3" y2="327.8" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<line x1="96" y1="446" x2="144.8" y2="354.2" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<line x1="96" y1="446" x2="438.4" y2="373.2" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<line x1="96" y1="446" x2="426.8" y2="291.7" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<path mask="url(#m-arc)" d="M96 446 C136 196 236 136 474 128" fill="none" stroke="#d9773a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="474" cy="128" r="8" fill="#d9773a"/>
<g class="breathe" opacity=".9"><circle cx="294.5" cy="421.6" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="294.5" cy="421.6" r="8" fill="#4a6fa5"/><circle cx="188.3" cy="327.8" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="188.3" cy="327.8" r="8" fill="#4a6fa5"/></g>
<g class="breathe b1" opacity=".9"><circle cx="379.7" cy="348.3" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="379.7" cy="348.3" r="8" fill="#4a6fa5"/><circle cx="144.8" cy="354.2" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="144.8" cy="354.2" r="8" fill="#4a6fa5"/></g>
<g class="breathe b2" opacity=".9"><circle cx="312.5" cy="321.0" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="312.5" cy="321.0" r="8" fill="#4a6fa5"/><circle cx="438.4" cy="373.2" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="438.4" cy="373.2" r="8" fill="#4a6fa5"/></g>
<g class="breathe b3" opacity=".9"><circle cx="243.2" cy="318.1" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="243.2" cy="318.1" r="8" fill="#4a6fa5"/><circle cx="426.8" cy="291.7" r="16" fill="#4a6fa5" opacity=".16"/><circle cx="426.8" cy="291.7" r="8" fill="#4a6fa5"/></g>
