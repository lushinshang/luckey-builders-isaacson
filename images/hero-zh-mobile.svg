<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>封面：從一個起點向外延伸（抽象示意）</title>
<desc>抽象示意圖，沒有文字、人像或任何產品外觀。米色底上有一個深色起點，數條灰色細線從起點呈扇形向右上方放射，末端各有一顆小圓點；一條橘色弧線從起點向上攀升，之後逐漸平緩。弧線以淡色底稿完整顯示，載入後描深一次並停在完整畫面，之後只有圓點極慢地微弱明暗變化；系統設定減少動態效果時直接顯示完整靜態畫面。</desc>
<rect width="540" height="540" fill="#f9f7f4"/>
<style>
.draw{animation:draw 4.7s cubic-bezier(.45,.05,.35,1) 0.3s both}
@keyframes draw{from{stroke-dashoffset:1.05}to{stroke-dashoffset:0}}
.breathe{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:.72}}
.b1{animation-delay:-2.5s}.b2{animation-delay:-5s}.b3{animation-delay:-7.5s}
@media (prefers-reduced-motion: reduce){.draw,.breathe{animation:none}}
</style>
<defs>
<mask id="m-arc" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="540"><path d="M96 446 C136 196 236 136 474 128" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke="#8f8f8f"/><path class="draw" d="M96 446 C136 196 236 136 474 128" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" pathLength="1" stroke-dasharray="1 2"/></mask>
</defs>
<circle cx="96" cy="446" r="80" fill="#f8e9dd" opacity=".5"/>
