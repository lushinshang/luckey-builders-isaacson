<circle cx="96" cy="446" r="68.0" fill="none" stroke="#8a8f99" stroke-width="1.2" stroke-dasharray="3 9" opacity=".45"/>
<line x1="96" y1="446" x2="294.5" y2="421.6" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<line x1="96" y1="446" x2="379.7" y2="348.3" stroke="#8a8f99" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
